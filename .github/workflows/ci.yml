name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Format, lint, types, tests (including the rebuild check on synthetic
      # source files, PRD F10) and a production build.
      - run: pnpm verify

  # Every public page against a seeded database and a production build, in
  # Chromium: Playwright specs, then the Lighthouse accessibility audit (score
  # of at least 90 on every page, both languages, both colour schemes). Kept
  # out of `verify`, which stays fast.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Built once; both suites serve this build (E2E_SKIP_BUILD).
      - run: pnpm build
      - name: Playwright end-to-end tests
        run: pnpm e2e
        env:
          E2E_SKIP_BUILD: "1"
      - name: Lighthouse accessibility
        run: pnpm lighthouse
        env:
          E2E_SKIP_BUILD: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-report/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
